    <div class="elfsight-app-6c505118-d8fd-4d95-9582-f07055906939"
         data-elfsight-app-lazy></div>

    <script>
    // Overlay fade-out — pure vanilla JS, no jQuery or Modernizr needed
    (function () {
        function hideOverlay() {
            var overlay = document.getElementById('overlay');
            if (!overlay) return;
            overlay.style.transition = 'opacity 0.4s ease';
            overlay.style.opacity = '0';
            setTimeout(function() { overlay.style.display = 'none'; }, 400);
        }
        window.addEventListener('load', hideOverlay);
        setTimeout(hideOverlay, 3000);
    })();

    // Move IG widget above footer
    (function () {
        function moveWidgetAboveFooter() {
            var widget = document.querySelector('.elfsight-app-6c505118-d8fd-4d95-9582-f07055906939');
            var footer = document.querySelector('[class*="FooterWrapper"]');
            if (widget && footer) {
                if (footer.parentNode && footer.previousElementSibling !== widget &&
                    (!widget.parentNode || widget.parentNode.id !== 'ig-widget-wrapper')) {
                    var wrapper = document.getElementById('ig-widget-wrapper');
                    if (!wrapper) {
                        wrapper = document.createElement('div');
                        wrapper.id = 'ig-widget-wrapper';
                        wrapper.style.cssText = 'display:flex;justify-content:center;width:100%;max-width:100vw;overflow:hidden;margin:2rem 0';
                    }
                    widget.style.margin = '0';
                    wrapper.appendChild(widget);
                    footer.parentNode.insertBefore(wrapper, footer);
                }
                return true;
            }
            return false;
        }
        if (!moveWidgetAboveFooter()) {
            var observer = new MutationObserver(function () {
                if (moveWidgetAboveFooter()) observer.disconnect();
            });
            observer.observe(document.getElementById('root') || document.body, { childList: true, subtree: true });
        }
    })();
    </script>
